{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}个人设置 - {{ block.super }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-3">
            <!-- 设置导航 -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">设置</h5>
                    <div class="nav flex-column nav-pills">
                        <a class="nav-link active" href="#profile" data-bs-toggle="pill">个人资料</a>
                        <a class="nav-link" href="#security" data-bs-toggle="pill">账号安全</a>
                        <a class="nav-link" href="#notification" data-bs-toggle="pill">通知设置</a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-9">
            <div class="tab-content">
                <!-- 个人资料设置 -->
                <div class="tab-pane fade show active" id="profile">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="card-title">个人资料设置</h4>
                            <form method="POST" enctype="multipart/form-data">
                                {% csrf_token %}
                                {{ form|crispy }}
                                <button type="submit" class="btn btn-primary">保存更改</button>
                            </form>
                            
                            <hr>
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="mb-1">用户名</h5>
                                    <p class="text-muted mb-0">{{ user.username }}</p>
                                </div>
                                <a href="{% url 'users:change_username' %}" class="btn btn-outline-primary">
                                    修改用户名
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 账号安全设置 -->
                <div class="tab-pane fade" id="security">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="card-title">账号安全</h4>
                            <div class="list-group">
                                <a href="{% url 'users:password_reset' %}" class="list-group-item list-group-item-action">
                                    <div class="d-flex w-100 justify-content-between">
                                        <h5 class="mb-1">修改密码</h5>
                                        <small><i class="fas fa-chevron-right"></i></small>
                                    </div>
                                    <p class="mb-1">定期更改密码可以提高账号安全性</p>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 通知设置 -->
                <div class="tab-pane fade" id="notification">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="card-title">通知设置</h4>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="emailNotification" checked>
                                <label class="form-check-label" for="emailNotification">接收邮件通知</label>
                            </div>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" id="messageNotification" checked>
                                <label class="form-check-label" for="messageNotification">接收站内消息</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
