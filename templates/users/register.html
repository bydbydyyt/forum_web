{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}注册 - {{ block.super }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="text-center mb-4">注册新账号</h2>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100">注册</button>
                    </form>
                    <hr>
                    <div class="text-center">
                        <p>已有账号？ <a href="{% url 'users:login' %}">立即登录</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
