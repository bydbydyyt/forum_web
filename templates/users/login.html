{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}登录 - {{ block.super }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="text-center mb-4">用户登录</h2>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100">登录</button>
                    </form>
                    <hr>
                    <div class="text-center">
                        <p>
                            <a href="{% url 'users:password_reset' %}">忘记密码？</a>
                        </p>
                        <p>还没有账号？ <a href="{% url 'users:register' %}">立即注册</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
